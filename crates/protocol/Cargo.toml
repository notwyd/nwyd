[package]
name = "nwyd-protocol"
description = "NWYD packet encoding, encryption, and network transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = false
publish = ["crates-io"]
include = ["/src/**", "/Cargo.toml", "/LICENSE", "!**/*.md"]

[dependencies]
formats.workspace = true
tracing.workspace = true

web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Crypto", "Event", "MessageEvent", "Storage", "Url", "UrlSearchParams", "WebSocket", "Window"] }
