[package]
name = "nwyd-audio"
description = "Audio decoding, mixing, and playback for the NWYD client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = false
publish = ["crates-io"]
include = ["/src/**", "/Cargo.toml", "/LICENSE", "!**/*.md"]

[dependencies]
formats.workspace = true

tracing.workspace = true

cpal.workspace = true
symphonia.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AudioContext", "AudioContextState", "Event", "EventTarget", "Window"] }
