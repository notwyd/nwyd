name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: nwyd
          - platform: windows
            runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            binary: nwyd.exe
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
            binary: nwyd
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary }}
      NWYD_BUILD_NUMBER: ${{ github.repository == 'notwyd/nwyd' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.run_number || 0 }}
      CARGO_XWIN_VERSION: "0.23.1"
      XWIN_ARCH: x86_64
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows cross-compilation dependencies
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config clang lld llvm cmake ninja-build

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$BUILD_TARGET"
          rustup default stable

      - name: Install Rust LLVM tools
        if: matrix.platform == 'windows'
        run: rustup component add llvm-tools --toolchain stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-directories: ${{ matrix.platform == 'windows' && '.xwin-cache' || '' }}

      - name: Install cargo-xwin
        if: matrix.platform == 'windows'
        run: cargo install --locked cargo-xwin --version "$CARGO_XWIN_VERSION"

      - name: Build Linux or macOS release
        if: matrix.platform != 'windows'
        run: cargo build --locked --release --target "$BUILD_TARGET" -p nwyd

      - name: Build Windows release from Linux
        if: matrix.platform == 'windows'
        run: cargo xwin build --locked --release --target "$BUILD_TARGET" -p nwyd

      - name: Package executable
        run: |
          mkdir -p dist/package
          cp "target/$BUILD_TARGET/release/$BINARY_NAME" dist/package/
          cp LICENSE crates/nwyd/assets/LiberationSans-LICENSE.txt dist/package/
          tar -czf "dist/nwyd-$BUILD_TARGET.tar.gz" -C dist/package .

      - name: Upload release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: client-${{ matrix.target }}
          path: dist/nwyd-${{ matrix.target }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  web:
    name: WebAssembly browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version=$(awk '/name = "wasm-bindgen"/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies
        run: npm --prefix web ci
      - name: Check browser target, folder importer, and asset cache
        run: make test-web
      - name: Build browser bundle
        run: make release-web
      - name: Verify production browser assets and WASM initialization
        run: npm --prefix web run check:build
      - name: Upload browser bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nwyd-web
          path: dist/
          if-no-files-found: error

  relay:
    name: Relay ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: nwyd-relay-linux-x86_64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nwyd-relay-windows-x86_64.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: nwyd-relay-macos-aarch64.tar.gz
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELAY_ASSET: ${{ matrix.asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$BUILD_TARGET"
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: relay-${{ matrix.target }}
      - name: Test relay and UI
        run: cargo test --locked -p nwyd-relay --all-targets
      - name: Build relay
        run: |
          if [[ "$BUILD_TARGET" == *-windows-* ]]; then
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo build --locked --release --target "$BUILD_TARGET" -p nwyd-relay
      - name: Package relay
        run: |
          mkdir -p relay-dist
          if [[ "$BUILD_TARGET" == *-windows-* ]]; then
            cp "target/$BUILD_TARGET/release/nwyd-relay.exe" "relay-dist/$RELAY_ASSET"
          else
            mkdir -p relay-package
            cp "target/$BUILD_TARGET/release/nwyd-relay" LICENSE relay-package/
            tar -czf "relay-dist/$RELAY_ASSET" -C relay-package .
          fi
          cp LICENSE relay-dist/LICENSE.txt
      - name: Upload relay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-${{ matrix.target }}
          path: relay-dist/
          if-no-files-found: error

  publish:
    name: Publish all downloads
    needs: [release, web, relay]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-downloads
      cancel-in-progress: false
    steps:
      - name: Download client builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: client-*
          merge-multiple: true
          path: release-dist
      - name: Download relay builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: relay-*
          merge-multiple: true
          path: release-dist
      - name: Download browser bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nwyd-web
          path: web-dist
      - name: Package browser bundle
        run: tar -czf release-dist/nwyd-web.tar.gz -C web-dist .
      - name: Publish latest builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: nwyd-latest
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd release-dist
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          release=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // null' releases.json)
          if [[ "$release" != null ]]; then
            manifest_id=$(jq -r '[.assets[] | select(.name == "version.json")] | first | .id // empty' <<< "$release")
            if [[ -n "$manifest_id" ]]; then
              gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$manifest_id" > previous-version.json
              previous_build=$(jq -er 'select(.schema_version == 1 and (.build_number | type == "number") and (.build_number | floor == .) and .build_number > 0) | .build_number' previous-version.json)
              if (( previous_build > SOURCE_BUILD_NUMBER )); then
                echo "Build $previous_build is already published; skipping older build $SOURCE_BUILD_NUMBER."
                exit 0
              fi
            fi
          fi
          assets=(
            nwyd-x86_64-unknown-linux-gnu.tar.gz
            nwyd-x86_64-pc-windows-msvc.tar.gz
            nwyd-aarch64-apple-darwin.tar.gz
            nwyd-web.tar.gz
            nwyd-relay-linux-x86_64.tar.gz
            nwyd-relay-windows-x86_64.exe
            nwyd-relay-macos-aarch64.tar.gz
          )
          for asset in "${assets[@]}" LICENSE.txt; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          jq -n --arg commit "$SOURCE_COMMIT" --argjson build_number "$SOURCE_BUILD_NUMBER" '{
            schema_version: 1,
            commit: $commit,
            build_number: $build_number,
            assets: {
              "x86_64-unknown-linux-gnu": "nwyd-x86_64-unknown-linux-gnu.tar.gz",
              "x86_64-pc-windows-msvc": "nwyd-x86_64-pc-windows-msvc.tar.gz",
              "aarch64-apple-darwin": "nwyd-aarch64-apple-darwin.tar.gz"
            }
          }' > version.json
          sha256sum "${assets[@]}" version.json > SHA256SUMS
          cat > release-notes.txt <<EOF
          Builds mais recentes da branch main.

          Cliente: baixe o arquivo nwyd correspondente ao seu sistema (Windows x86_64, Linux x86_64 ou macOS ARM64).

          Navegador: nwyd-web.tar.gz contém os arquivos prontos para hospedagem, com index.html na raiz.

          Relay: no Windows, execute nwyd-relay-windows-x86_64.exe. No Linux e macOS, extraia o arquivo correspondente e execute nwyd-relay.
          Mantenha o relay aberto para jogar em https://notwyd.app/play.

          Commit: $SOURCE_COMMIT
          EOF
          if [[ "$release" != null ]]; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS LICENSE.txt --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$SOURCE_COMMIT" -F force=true
            gh release edit "$RELEASE_TAG" --title 'NWYD' --notes-file release-notes.txt --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS LICENSE.txt --target "$SOURCE_COMMIT" --title 'NWYD' --notes-file release-notes.txt --latest
          fi
          gh release upload "$RELEASE_TAG" version.json --clobber
